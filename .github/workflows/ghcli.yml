name: ghcli

on: 
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Show environment values
        run: ls -l &&
             echo $GITHUB_ACTION &&
             echo $GITHUB_EVENT_NAME &&
             echo $GITHUB_REPOSITORY &&
             echo $GITHUB_RUN_NUMBER &&
             echo $GITHUB_WORKFLOW &&
             echo $GITHUB_WORKSPACE &&
             echo $GITHUB_NAME &&
             echo $GITHUB_OS &&
             echo $GITHUB_ARCH
    
